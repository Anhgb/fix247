[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fix247-api"
version = "0.1.0"
description = "Fix 24/7 – AI-assisted repair marketplace backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.4",
    "minio>=7.2.7",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.4",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "cryptography>=42.0.7",
    "pillow>=10.3.0",
    "python-slugify>=8.0.4",
    "orjson>=3.10.3",
    "structlog>=24.1.0",
    "uuid6>=2022.10.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "factory-boy>=3.3.0",
    "Faker>=25.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
